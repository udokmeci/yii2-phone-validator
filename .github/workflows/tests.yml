name: Tests

on:
  push:
    branches: [ "master", "maintenance" ]
  pull_request:
    branches: [ "master", "maintenance" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
        yii-version: ['~2.0.40', '~2.0.45']
    
    name: PHP ${{ matrix.php-version }} - Yii ${{ matrix.yii-version }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl
        coverage: xdebug
    
    - name: Validate composer.json
      run: composer validate --strict
    
    - name: Get composer cache directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    
    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-${{ runner.os }}-
    
    - name: Install dependencies
      run: |
        composer require "yiisoft/yii2:${{ matrix.yii-version }}" --no-update
        composer install --prefer-dist --no-progress
    
    - name: Run PHPUnit tests
      run: |
        vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
    
    - name: Run PHPStan static analysis
      run: vendor/bin/phpstan analyse
    
    - name: Run PHP_CodeSniffer
      run: vendor/bin/phpcs src/ --standard=PSR12 --ignore=messages
    
    - name: Upload coverage to Codecov
      if: matrix.php-version == '8.1' && matrix.yii-version == '~2.0.45'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  compatibility:
    runs-on: ubuntu-latest
    name: PHP Compatibility Check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, intl
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Check PHP compatibility
      run: |
        composer global require phpcompatibility/php-compatibility
        ~/.composer/vendor/bin/phpcs --config-set installed_paths \
          ~/.composer/vendor/phpcompatibility/php-compatibility
        ~/.composer/vendor/bin/phpcs --standard=PHPCompatibility \
          --runtime-set testVersion 8.1- src/